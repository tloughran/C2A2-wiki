 for(const f of data.files){const q=place(f);if(q)FILES.push(q)}
 FILES.sort((a,b)=>a.t-b.t);
 for(const s of data.signals){const a=SLUG[s.a],b=SLUG[s.b];if(a&&b&&HUB[a]&&HUB[b])SIG.push({a,b,t:new Date(s.d+'T12:00:00Z').getTime()+(hash(s.a+s.b+s.d)%DAY),s:s.s})}
 SIG.sort((a,b)=>a.t-b.t);
 for(const p of data.prs){if(HUB[p.t])PRS.push({k:p.t,t:new Date(p.d+'T12:00:00Z').getTime()+(hash(p.id+p.t)%DAY)})}
 PRS.sort((a,b)=>a.t-b.t);
 for(const l of data.lanes){
  const th=(l.thinkers||[]).map(n=>SLUG[n]).filter(Boolean);
  for(const [d,n] of Object.entries(l.days)){const base=new Date(d+'T00:00:00Z').getTime();const r=rng(hash(l.label+d));
   for(let i=0;i<n;i++){RUNS.push({t:base+r()*DAY,cat:l.category,th,lab:l.label,seed:r()})}}}
 RUNS.sort((a,b)=>a.t-b.t);
 SUMMA=data.summa.map(s=>({t:new Date(s.d+'T12:00:00Z').getTime(),day:s.day,n:s.articles||0,q:(s.questions||[])})).sort((a,b)=>a.t-b.t);
 SUMMA_DAYS=SUMMA.length;
 let acc=0;for(const e of SUMMA){acc+=e.n;e.cum=acc}
 STOT=data.summa_totals||{};
 let la=0;for(const r of data.yield_daily){la+=(r.links_added||0)-(r.links_removed||0);LINKS.push({t:new Date(r.date+'T12:00:00Z').getTime(),cum:la})}
 HB=data.heartbeat.map(d=>({t:new Date(d+'T12:00:00Z').getTime()})).sort((a,b)=>a.t-b.t);
}

const ctx=document.getElementById('c').getContext('2d');
function fmt(t){const d=new Date(t);return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'})}
function lowerBound(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<t)lo=m+1;else hi=m}return lo}

// now = vault time (ms); perSec = vault ms per real second (pulse ages are in real seconds)
function render(now,perSec){
 ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(CX,CY,HUB_R,0,7);ctx.stroke();
 ctx.beginPath();ctx.arc(CX,CY,HUB_R+90,0,7);ctx.stroke();ctx.beginPath();ctx.arc(CX,CY,HUB_R+170,0,7);ctx.stroke();
 const nf=lowerBound(FILES,now);
 for(let i=0;i<nf;i++){const f=FILES[i];const age=(now-f.t)/perSec;
  const pop=age<0.6?1+(0.6-age)*3:1;const al=age<0.6?1:0.55;
  ctx.globalAlpha=al;ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,f.size*pop,0,7);ctx.fill();}
 ctx.globalAlpha=1;
 const ns=lowerBound(SIG,now);
 for(let i=ns-1;i>=0;i--){const s=SIG[i];const age=(now-s.t)/perSec;if(age>1.4)break;const a=HUB[s.a],b=HUB[s.b];
  const al=(1-age/1.4)*(s.s==='Strong'?0.9:s.s==='High'?0.7:0.45);ctx.strokeStyle=`rgba(232,220,192,${al})`;ctx.lineWidth=s.s==='Strong'?2.2:1.2;
  ctx.beginPath();ctx.moveTo(a.x,a.y);const mx=(a.x+b.x)/2+(CX-(a.x+b.x)/2)*0.35,my=(a.y+b.y)/2+(CY-(a.y+b.y)/2)*0.35;ctx.quadraticCurveTo(mx,my,b.x,b.y);ctx.stroke();}
 const np=lowerBound(PRS,now);
 for(let i=np-1;i>=0;i--){const p=PRS[i];const age=(now-p.t)/perSec;if(age>0.9)break;const h=HUB[p.k];
  ctx.strokeStyle=PAL[p.k];ctx.globalAlpha=(1-age/0.9)*0.9;ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,16+age*40,0,7);ctx.stroke();}
 ctx.globalAlpha=1;
 const nr=lowerBound(RUNS,now);
 for(let i=nr-1;i>=0;i--){const r=RUNS[i];const age=(now-r.t)/perSec;if(age>1.0)break;const u=age/1.0;
  let x0,y0,x1,y1,col;
  if(r.th.length>=2){const a=HUB[r.th[0]],b=HUB[r.th[1]];x0=a.x;y0=a.y;x1=b.x;y1=b.y;col=PAL[r.th[0]]}
  else if(r.th.length===1){const h=HUB[r.th[0]];x0=CX;y0=CY;x1=h.x;y1=h.y;col=PAL[r.th[0]]}
  else if(r.cat==='interactive'){x0=1660;y0=470;const ang=r.seed*2*Math.PI;x1=CX+HUB_R*0.75*Math.cos(ang);y1=CY+HUB_R*0.75*Math.sin(ang);col='#ffffff'}
  else if(r.cat==='infrastructure'){x0=CX;y0=CY;const ang=r.seed*2*Math.PI;x1=CX+130*Math.cos(ang);y1=CY+130*Math.sin(ang);col=ARCH}
  else if(r.lab.startsWith('summa')){x0=CX;y0=CY;x1=400+r.seed*1120;y1=1036;col='#C9A84C'}
  else {x0=CX;y0=CY;const ang=r.seed*2*Math.PI;const d=HUB_R+90+r.seed*80;x1=CX+d*Math.cos(ang);y1=CY+d*Math.sin(ang);col=AGENT}
  const bend=(r.seed-0.5)*120;const mx=(x0+x1)/2-(y1-y0)/Math.hypot(x1-x0,y1-y0||1)*bend,my=(y0+y1)/2+(x1-x0)/Math.hypot(x1-x0,y1-y0||1)*bend;
  const px=(1-u)*(1-u)*x0+2*(1-u)*u*mx+u*u*x1,py=(1-u)*(1-u)*y0+2*(1-u)*u*my+u*u*y1;
  ctx.globalAlpha=0.9*(1-u*0.3);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();
  const u0=Math.max(0,u-0.12);const qx=(1-u0)*(1-u0)*x0+2*(1-u0)*u0*mx+u0*u0*x1,qy=(1-u0)*(1-u0)*y0+2*(1-u0)*u0*my+u0*u0*y1;
  ctx.moveTo(qx,qy);ctx.lineTo(px,py);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,2.2,0,7);ctx.fill();}
 ctx.globalAlpha=1;
 const born=new Date('2026-04-07T12:00:00Z').getTime();
 for(const k of ORDER){const h=HUB[k];const age=(now-born)/perSec;if(age<0)continue;const sc=Math.min(1,age/0.8);
  ctx.fillStyle=PAL[k];ctx.beginPath();ctx.arc(h.x,h.y,9*sc,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='500 20px Inter, Helvetica, Arial, sans-serif';
  const ox=Math.cos(h.a)*26,oy=Math.sin(h.a)*26;ctx.textAlign=Math.abs(Math.cos(h.a))<0.3?'center':(Math.cos(h.a)>0?'left':'right');ctx.textBaseline='middle';
  ctx.globalAlpha=sc;ctx.fillText(LABEL[k],h.x+ox,h.y+oy);ctx.globalAlpha=1;}
 ctx.fillStyle=MASTER;ctx.beginPath();ctx.arc(CX,CY,7,0,7);ctx.fill();
 const nsum=lowerBound(SUMMA,now);
 ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='500 15px Inter, Helvetica, Arial, sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';
 if(nsum>0){const e=SUMMA[nsum-1];const pct=STOT.articles?Math.round(1000*e.cum/STOT.articles)/10:0;ctx.fillText('SUMMA COMMENTARY  day '+nsum+' of '+SUMMA_DAYS+'  ·  '+e.cum.toLocaleString()+' of '+(STOT.articles||0).toLocaleString()+' articles  ·  '+pct+'%',400,1016);}
 for(let i=0;i<nsum;i++){const age=(now-SUMMA[i].t)/perSec;const al=age<0.6?1:0.75;ctx.globalAlpha=al;ctx.fillStyle='#C9A84C';ctx.fillRect(400+i*(1120/Math.max(SUMMA_DAYS,1)),1028,Math.max(1.5,1120/Math.max(SUMMA_DAYS,1)-1),22);}
 ctx.globalAlpha=1;
 ctx.fillStyle='#ffffff';ctx.font='600 46px Inter, Helvetica, Arial, sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';
 ctx.fillText(fmt(now),60,96);
 ctx.font='400 18px Inter, Helvetica, Arial, sans-serif';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('C2A2 — the vault, day by day',60,128);
 ctx.font='400 14px Inter, Helvetica, Arial, sans-serif';ctx.fillStyle='rgba(255,255,255,0.32)';
 ctx.fillText('Data: agent runs from OpenStory telemetry; files and wikilinks from git history;',60,152);
 ctx.fillText('signals, triplets, Summa and Heartbeat from the vault itself',60,171);
 const runs=nr,files=nf,sigs=ns,prs=np;
 const rows=[[files,'files in the vault'],[runs,'agent runs'],[prs,'PRS triplets'],[sigs,'cross-tradition signals']];
 ctx.textAlign='right';let yy=80;
 for(const [n,l] of rows){ctx.fillStyle='#ffffff';ctx.font='600 36px Inter, Helvetica, Arial, sans-serif';ctx.fillText(n.toLocaleString(),1700,yy);
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='400 18px Inter, Helvetica, Arial, sans-serif';ctx.textAlign='left';ctx.fillText(l,1714,yy);ctx.textAlign='right';yy+=48;}
 const nl=lowerBound(LINKS,now);const links=nl>0?LINKS[nl-1].cum:0;const nhb=lowerBound(HB,now);
 const left=[[links,'wikilinks written'],[nhb,'AI Heartbeat items captured']];
 let ly=232;ctx.textAlign='left';
 for(const [n,l] of left){ctx.fillStyle='#ffffff';ctx.font='600 36px Inter, Helvetica, Arial, sans-serif';ctx.fillText(n.toLocaleString(),60,ly);
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='400 18px Inter, Helvetica, Arial, sans-serif';ctx.fillText(l,60,ly+26);ly+=76;}
 ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font='500 14px Inter, Helvetica, Arial, sans-serif';
 const nif=FILES.slice(0,nf);
 if(nif.some(f=>f.g==='heartbeat'))ctx.fillText('AI HEARTBEAT',260,570);
 if(nif.some(f=>f.g==='agents'||f.g==='interface'))ctx.fillText('INTERFACES  ·  AGENTS',1660,570);
 if(nif.some(f=>f.g==='PETER'||f.g==='paper_responses'))ctx.fillText('PAPER RESPONSES',260,880);
 if(nif.some(f=>f.g==='architecture'&&f.p.includes('lit_search')))ctx.fillText('LITERATURE SEARCH',CX,CY-HUB_R-178);
 if(nif.some(f=>f.g==='inbox'))ctx.fillText('ASSESSMENT · PROPOSALS',CX,CY-212);
}

// ---- clock + controls ----
const $=id=>document.getElementById(id);
let simNow=0,playing=false,lastTs=null,speedDays=1;
const CAPS=CAPTIONS.map(c=>({t:new Date(c.start+'T00:00:00Z').getTime(),title:c.title,text:c.text}));
function caption(now){let cur=null;for(const c of CAPS){if(c.t<=now)cur=c;else break}
 if(!cur){$('cap-t').textContent='';$('cap-x').textContent='';return}
 if($('cap-t').textContent!==cur.title){$('cap-t').textContent=cur.title;$('cap-x').textContent=cur.text}}
function draw(){render(simNow,speedDays*DAY);$('scrub').value=Math.round(1000*(simNow-T0)/(T1-T0));caption(simNow)}
function frame(ts){if(!playing)return;if(lastTs!==null){simNow+=(ts-lastTs)/1000*speedDays*DAY;if(simNow>=T1){simNow=T1;setPlaying(false)}}lastTs=ts;draw();if(playing)requestAnimationFrame(frame)}
function setPlaying(p){playing=p;lastTs=null;$('play').textContent=p?'Pause':'Play';if(p)requestAnimationFrame(frame)}
$('play').onclick=()=>{if(!playing&&simNow>=T1)simNow=T0;setPlaying(!playing)};
$('scrub').oninput=e=>{simNow=T0+(T1-T0)*e.target.value/1000;draw()};
$('speed').onchange=e=>{speedDays=parseFloat(e.target.value)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('play').click()}});
if(FILM_URL){$('film').href=FILM_URL;$('film').hidden=false}
load(DATA);simNow=T0;draw();
// Exposed for the voice guide / CCL (next increment): play, pause, seek by date, read state.
window.vaultLife={play:()=>setPlaying(true),pause:()=>setPlaying(false),
 seek:d=>{simNow=Math.max(T0,Math.min(T1,new Date(d+'T12:00:00Z').getTime()));draw()},
 state:()=>({date:new Date(simNow).toISOString().slice(0,10),playing,speedDays,caption:$('cap-t').textContent})};
</script></body></html>
