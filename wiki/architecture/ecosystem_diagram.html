<script>
  // Standalone host: layer labels copy a drill-in question to the clipboard.
  function sendPrompt(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){flash('Copied: '+t);},function(){flash(t);});
    } else { flash(t); }
  }
  function flash(msg){
    var el=document.getElementById('zlabel');
    var prev=el.textContent; el.textContent='✓ prompt copied';
    setTimeout(function(){el.textContent=prev;},1600);
  }
  // Zoom controls
  var z=1, wrap=document.getElementById('wrap'), lbl=document.getElementById('zlabel');
  function apply(){wrap.style.transform='scale('+z+')';lbl.textContent=Math.round(z*100)+'%';}
  document.getElementById('zin').onclick=function(){z=Math.min(2.5,z+0.15);apply();};
  document.getElementById('zout').onclick=function(){z=Math.max(0.5,z-0.15);apply();};
  document.getElementById('zreset').onclick=function(){z=1;apply();};
</script>
