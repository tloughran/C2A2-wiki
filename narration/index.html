<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C2A2 Wiki Growth Visualization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <header id="app-header">
    <div class="title-block">
      <h1>C2A2: AI-Driven Research Synthesis</h1>
      <div class="stats" id="header-stats">
        <span id="stat-files">— files</span>
        <span id="stat-traditions">— traditions</span>
        <span id="stat-findings">— findings</span>
        <span id="stat-decisions">— decisions</span>
      </div>
    </div>
    <div class="header-buttons">
      <label class="intro-toggle" title="Play the introduction and summary when starting History">
        <input type="checkbox" id="intro-toggle">
        <span>Intro + outro</span>
      </label>
      <button class="btn" data-tour="history">History</button>
      <button class="btn" data-tour="recent">Recent (3d)</button>
      <button class="btn" data-tour="latest">Latest</button>
      <label class="brightness">
        Brightness
        <input type="range" id="brightness-slider" min="20" max="250" value="100">
      </label>
      <button class="btn" id="record-btn">Record</button>
      <button class="btn icon" id="settings-btn" title="Settings">⚙</button>
    </div>
  </header>

  <main id="graph-container">
    <svg id="graph"></svg>
    <div id="color-legend" class="legend">
      <div class="legend-title"><span>Categories</span></div>
      <label class="legend-master">
        <input type="checkbox" id="legend-master" checked>
        <span>Show / hide all</span>
      </label>

      <div class="legend-group no-sep">
        <div class="legend-group-title">Other</div>
        <label class="legend-row" data-category="agents"><input type="checkbox" checked><span class="swatch" style="background:#9B59B6"></span>Agents</label>
        <label class="legend-row" data-category="architecture"><input type="checkbox" checked><span class="swatch" style="background:#E67E22"></span>Architecture</label>
        <label class="legend-row" data-category="flags"><input type="checkbox" checked><span class="swatch" style="background:#E74C3C"></span>Flags / findings</label>
        <label class="legend-row" data-category="decisions"><input type="checkbox" checked><span class="swatch" style="background:#2ECC71"></span>Decisions</label>
        <label class="legend-row" data-category="review"><input type="checkbox" checked><span class="swatch" style="background:#F1C40F"></span>Review</label>
        <label class="legend-row" data-category="master"><input type="checkbox" checked><span class="swatch" style="background:#1ABC9C"></span>Master</label>
        <label class="legend-row" data-category="inbox"><input type="checkbox" checked><span class="swatch" style="background:#95A5A6"></span>Inbox / deferred</label>
      </div>

      <div class="legend-group">
        <div class="legend-group-title">Traditions</div>
        <label class="legend-row" data-category="traditions/friston"><input type="checkbox" checked><span class="swatch" style="background:#3498DB"></span>Friston</label>
        <label class="legend-row" data-category="traditions/hoffman"><input type="checkbox" checked><span class="swatch" style="background:#E91E63"></span>Hoffman</label>
        <label class="legend-row" data-category="traditions/levin"><input type="checkbox" checked><span class="swatch" style="background:#1ABC9C"></span>Levin</label>
        <label class="legend-row" data-category="traditions/kastrup"><input type="checkbox" checked><span class="swatch" style="background:#8E44AD"></span>Kastrup</label>
        <label class="legend-row" data-category="traditions/mcgilchrist"><input type="checkbox" checked><span class="swatch" style="background:#00BCD4"></span>McGilchrist</label>
        <label class="legend-row" data-category="traditions/fredrickson"><input type="checkbox" checked><span class="swatch" style="background:#F39C12"></span>Fredrickson</label>
        <label class="legend-row" data-category="traditions/hawkins"><input type="checkbox" checked><span class="swatch" style="background:#FF7043"></span>Hawkins</label>
        <label class="legend-row" data-category="traditions/stump"><input type="checkbox" checked><span class="swatch" style="background:#A1887F"></span>Stump</label>
        <label class="legend-row" data-category="traditions/carroll"><input type="checkbox" checked><span class="swatch" style="background:#5DADE2"></span>Carroll</label>
        <label class="legend-row" data-category="traditions/arkanihamed"><input type="checkbox" checked><span class="swatch" style="background:#F1C40F"></span>Arkani-Hamed</label>
        <label class="legend-row" data-category="traditions/wolfram"><input type="checkbox" checked><span class="swatch" style="background:#C0392B"></span>Wolfram</label>
      </div>
    </div>
  </main>

  <aside id="detail-panel" class="hidden">
    <button class="close" id="detail-close" aria-label="Close">×</button>
    <div id="detail-content"></div>
  </aside>

  <footer id="narration-bar">
    <div class="timeline-row">
      <button id="footer-toggle" title="Collapse/expand">▾</button>
      <input type="range" id="date-slider" min="0" max="0" value="0">
      <span id="date-label" class="date-label">—</span>
    </div>
    <div class="narration-row">
      <div class="narration-text" id="narration-text">Press History to begin the tour.</div>
      <div class="controls">
        <button class="btn" id="play-pause-btn">Play</button>
        <button class="btn" id="reset-btn">Reset</button>
        <select id="speed-select" title="Playback speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <button class="btn icon" id="mute-btn" title="Mute">🔊</button>
        <button class="btn" id="brief-deep-btn">Brief</button>
      </div>
    </div>
  </footer>

  <div id="chat-panel">
    <input type="text" id="chat-input" placeholder="Ask about the wiki…">
    <button class="btn primary" id="chat-submit">Ask</button>
  </div>

  <div id="settings-overlay" class="hidden"></div>
  <div id="settings-modal" class="hidden" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="close" id="settings-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="tts-provider">TTS Provider</label>
        <select id="tts-provider">
          <option value="browser">Browser voice (built-in)</option>
          <option value="openai">OpenAI (natural — requires API key)</option>
        </select>
      </div>
      <div class="form-group" id="openai-group" hidden>
        <label for="tts-api-key">OpenAI API Key</label>
        <input type="password" id="tts-api-key" placeholder="sk-…" autocomplete="off">
        <label for="tts-voice-openai">Voice</label>
        <select id="tts-voice-openai">
          <option value="nova" selected>Nova (warm, natural)</option>
          <option value="alloy">Alloy (neutral)</option>
          <option value="echo">Echo (deeper)</option>
          <option value="fable">Fable (expressive)</option>
          <option value="onyx">Onyx (deep, grounded)</option>
          <option value="shimmer">Shimmer (bright)</option>
        </select>
      </div>
      <div class="form-group" id="browser-group">
        <label for="tts-voice-browser">Browser voice</label>
        <select id="tts-voice-browser">
          <option value="">Default</option>
        </select>
      </div>
      <div id="tts-status" class="status"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="tts-test-btn">Test Voice</button>
      <button class="btn primary" id="tts-save-btn">Save</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
